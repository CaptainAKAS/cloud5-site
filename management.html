function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();
  var msg=document.getElementById('msg'),go=document.getElementById('go');
  msg.textContent='';go.disabled=true;go.textContent='Opening…';
  crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey'])
    .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.s),iterations:DATA.i,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.v)},k,b64(DATA.c))})
    .then(function(buf){var html=new TextDecoder().decode(buf);document.open();document.write(html);document.close()})
    .catch(function(){msg.textContent='Wrong password.';go.disabled=false;go.textContent='Open'});
});
